[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymojis"
version = "1.0.1"
description = "A lightweight, type-safe Python library for emoji search, transformation, and detection."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Pallandir", email = "pallandir2@gmail.com"}
]
maintainers = [
    {name = "Pallandir", email = "pallandir2@gmail.com"}
]
keywords = ["emoji", "unicode", "text", "utilities"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Topic :: Utilities",
    "Typing :: Typed",
    "Natural Language :: English",
]
dependencies = []

[project.optional-dependencies]
full = ["pymojis-fulldata==1.0.1"]
dev = [
    "build~=1.2",
    "pre-commit~=4.2",
    "pytest~=8.4",
    "pytest-cov~=6.0",
    "pytest-mock~=3.10",
    "twine~=6.1",
    "mypy~=1.0",
    "ruff~=0.8",
]
test = [
    "pytest~=8.4",
    "pytest-cov~=6.0",
    "pytest-mock~=3.10",
]

[project.urls]
Homepage = "https://github.com/pallandir/pymojis"
Repository = "https://github.com/pallandir/pymojis"
Issues = "https://github.com/pallandir/pymojis/issues"
Changelog = "https://github.com/pallandir/pymojis/releases"

[project.scripts]
pymojis = "pymojis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pymojis*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
pymojis = ["py.typed", "infrastructure/data/*.json"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pymojis-fulldata = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "T20", # print found
    "N",   # pep8-naming
    "S",   # bandit security checks
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow asserts in tests
"scripts/*" = ["T20"]  # CI scripts may print
"src/pymojis/cli.py" = ["T20"]  # CLI prints to stdout/stderr by design
"src/pymojis/__main__.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/tests/*",
    "*/test_*",
    "*/conftest.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
]
fail_under = 80
