[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pymojis"
version = "1.0.0"
description = "A Python library for emoji handling and utilities"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Pallandir", email = "pallandir2@gmail.com"}
]
maintainers = [
    {name = "Pallandir", email = "pallandir2@gmail.com"}
]
keywords = ["emoji", "unicode", "text", "utilities"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Topic :: Utilities",
    "Typing :: Typed",
    "Natural Language :: English",
]
dependencies = []  # Runtime dependencies only - moved pytest-cov

[project.optional-dependencies]
dev = [
    "build~=1.2",
    "pre-commit~=4.2",
    "pytest~=8.4",
    "pytest-cov~=6.0",
    "pytest-mock~=3.10",
    "twine~=6.1",
    "black~=24.0",
    "isort~=5.12",
    "mypy~=1.0",
    "ruff~=0.1",
]
test = [
    "pytest~=8.4",
    "pytest-cov~=6.0",
    "pytest-mock~=3.10",
]
docs = [
    "sphinx~=7.0",
    "sphinx-rtd-theme~=1.3",
    "myst-parser~=2.0",
]
full = ["pymojis-fulldata"]

[project.urls]
Homepage = "https://github.com/pallandir/pymojis"
Repository = "https://github.com/pallandir/pymojis"
"Bug Reports" = "https://github.com/pallandir/pymojis/issues"
"Source Code" = "https://github.com/pallandir/pymojis"
Changelog = "https://github.com/pallandir/pymojis/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pymojis*"]
exclude = ["tests*", "*.tests", "*.tests.*"]

[tool.setuptools.package-data]
pymojis = ["py.typed", "data/*.json"]  # Be explicit about what you include

# Pytest configuration
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.black]
line-length = 88
target-version = ["py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["pymojis"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "T201",# print found
    "N",   # pep8-naming
    "S",   # bandit security checks
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "S101", "S105", "S106"]  # Allow asserts and hardcoded secrets in tests

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/tests/*",
    "*/test_*",
    "*/conftest.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
]
fail_under = 80
